<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Share a credential: demo wallet</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Share a credential</h1>
    <p id="status" class="notice" hidden></p>

    <section id="account-section" hidden>
      <h2>Phantom</h2>
      <div id="account"></div>
    </section>

    <section id="request-section" hidden>
      <div id="request"></div>
    </section>

    <section id="result-section" hidden>
      <h2>Result</h2>
      <div id="result"></div>
    </section>

    <p><a href="/">Back to the wallet</a></p>
  </main>
  <script type="module" src="/js/present.js"></script>
</body>
</html>
