[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
credential_registry = "6NY7DBX4GQTq25E8pcrxUw4wDtGAC3EX1QVwD8jUDUMy"

[provider]
cluster = "localnet"
wallet = "~/build/credential-registry-dev-wallet.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]

# Load the program as upgradeable so the provider wallet is its upgrade authority
# (initialize_registry requires it).
[[test.genesis]]
address = "6NY7DBX4GQTq25E8pcrxUw4wDtGAC3EX1QVwD8jUDUMy"
program = "target/deploy/credential_registry.so"
upgradeable = true
